name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release tag matches mac version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./apps/mac/package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Release tag v$TAG_VERSION does not match apps/mac/package.json version $APP_VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace
        run: |
          pnpm typecheck
          pnpm test
          pnpm audit --audit-level moderate
          pnpm build

      - name: Validate release secrets
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"

      - name: Write Apple API key to file
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/secrets/AuthKey.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}

      - name: Build signed and notarized macOS artifacts
        run: pnpm --filter @openfolio/mac dist:mac
        env:
          APPLE_API_KEY: ${{ runner.temp }}/secrets/AuthKey.p8

      - name: Verify packaged application
        run: |
          APP_PATH="$(find apps/mac/dist -type d -name OpenFolio.app -print -quit)"
          test -n "$APP_PATH"
          pnpm --filter @openfolio/mac artifact:verify -- "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Stage verified artifacts in a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft
          fi
          gh release upload "$GITHUB_REF_NAME" apps/mac/dist/*.dmg apps/mac/dist/*.zip --clobber

      # Publishing the draft remains a manual release action after the signed
      # artifact completes the documented PID-attributed zero-traffic matrix.
